services:
  postgres:
    image: postgres:17-alpine
    container_name: iaworkflow-postgres
    environment:
      POSTGRES_DB: iaworkflow
      POSTGRES_USER: iaworkflow
      POSTGRES_PASSWORD: iaworkflow
    ports:
      - "15432:5432"
    volumes:
      - iaworkflow-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iaworkflow"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  iaworkflow-pgdata:
